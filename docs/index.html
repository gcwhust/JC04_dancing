<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="小楚 JC04 轮足机器人在 MuJoCo 中的《天鹅湖》手、腿、轮协同舞蹈仿真，提供视频与复现源码。">
  <title>小楚机器人 · 舞蹈仿真</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #17324a; background: #f3f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1080px; margin: auto; padding: 48px 24px; }
    .eyebrow { color: #237d8c; font-size: 13px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 12px 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.03em; }
    h2 { margin: 0 0 14px; font-size: 24px; letter-spacing: -.02em; }
    .intro { color: #52697b; line-height: 1.8; margin: 0 0 26px; }
    .dance { margin-top: 36px; scroll-margin-top: 24px; }
    .dance + .dance { margin-top: 44px; padding-top: 36px; border-top: 1px solid #d9e3ec; }
    .player { border: 1px solid #d9e3ec; border-radius: 16px; background: #e4edf4; overflow: hidden; box-shadow: 0 16px 44px #193e5c12; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; }
    .caption { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 16px 20px; background: white; color: #52697b; font-size: 14px; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; margin: 24px 0 18px; }
    a { color: #1c637e; text-underline-offset: 3px; }
    .links a { padding: 11px 17px; border: 1px solid #ccdae6; border-radius: 9px; text-decoration: none; font-weight: 600; background: white; }
    .links a:first-child { color: white; background: #1e647d; border-color: #1e647d; }
    .jump-links { display: flex; flex-wrap: wrap; gap: 12px 24px; font-size: 14px; }
    a:focus-visible { outline: 3px solid #efb331; outline-offset: 4px; }
    .note { color: #52697b; font-size: 14px; line-height: 1.8; }
    footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #d9e3ec; color: #52697b; font-size: 13px; }
    @media (max-width: 600px) { main { padding: 28px 16px; } .caption { padding: 12px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">JC04 DANCING / MUJOCO</div>
    <h1>小楚机器人 · 天鹅湖</h1>
    <p class="intro">双臂展翼，髋膝起伏，车轮随乐句滑行与转向。用重新编排的动作，呈现手、腿、轮的连贯配合。</p>
    <section class="dance" id="swan-lake" aria-labelledby="swan-title">
      <h2 id="swan-title">完整舞蹈</h2>
      <div class="player">
        <video controls playsinline preload="metadata" poster="media/swan-lake-poster.png" aria-label="小楚机器人天鹅湖舞蹈，含配乐，无对白">
          <source src="media/swan-lake.mp4?v=8bcce73d" type="video/mp4">
          当前浏览器不支持播放，请<a href="media/swan-lake.mp4?v=8bcce73d">下载 MP4 视频</a>。
        </video>
        <div class="caption"><span>99 秒 · 1920 × 1080 · 30 FPS</span><span>《天鹅湖》配乐 · 第 2 秒进入</span><span>手 · 腿 · 轮协同</span></div>
      </div>
      <nav class="links" aria-label="视频与资料">
        <a href="media/swan-lake.mp4?v=8bcce73d" download>下载完整有声视频</a>
        <a href="https://github.com/gcwhust/JC04_dancing#readme">源码与完整复现步骤</a>
        <a href="media/design.pdf">设计说明</a>
        <a href="media/workflow.png">运行流程图</a>
      </nav>
      <p class="note">点击播放，打开音量。前 2 秒是准备动作，随后音乐与舞蹈主体同时开始。</p>
    </section>
    <footer>基于 MuJoCo 的物理仿真。配乐为柴可夫斯基《天鹅湖》节选；<a href="https://github.com/gcwhust/JC04_dancing/blob/main/docs/audio-provenance.md">录音来源与说明</a>。模型、动作生成器与 CSV 随仓库提供。</footer>
  </main>

</html>
