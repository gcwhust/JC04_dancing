<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="小楚 JC04 轮足机器人在 MuJoCo 中的《天鹅湖》手、腿、轮协同舞蹈仿真，提供视频与复现源码。">
  <title>小楚机器人 · 天鹅湖</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #182e3b; background: #fafbf9; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1120px; margin: auto; padding: 64px 32px 32px; }
    header { margin-bottom: 36px; }
    .identity { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px 28px; color: #566972; font-size: 14px; line-height: 1.7; }
    .competition { margin: 0; letter-spacing: .04em; }
    .team { margin: 0; font-size: 13px; }
    .team span { margin-right: 10px; }
    h1 { margin: 24px 0 0; font-size: clamp(30px, 4.5vw, 48px); font-weight: 600; line-height: 1.3; letter-spacing: -.035em; }
    .dance { scroll-margin-top: 24px; }
    .player { border: 1px solid #dfe5e7; border-radius: 12px; background: #e4edf4; overflow: hidden; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; }
    .links { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 32px; margin-top: 18px; }
    a { color: #526671; text-decoration: none; text-underline-offset: 5px; }
    a:hover { color: #1d5864; text-decoration: underline; }
    .links a { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; }
    .links a:first-child { color: #1d5864; font-weight: 600; }
    a:focus-visible { outline: 2px solid #1d5864; outline-offset: 5px; border-radius: 2px; }
    footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #e1e6e5; font-size: 12px; }
    footer a { display: inline-flex; align-items: center; min-height: 32px; }
    @media (max-width: 600px) {
      main { padding: 32px 20px 24px; }
      header { margin-bottom: 24px; }
      .identity { align-items: flex-start; flex-direction: column; gap: 8px; }
      .competition { font-size: 13px; }
      h1 { margin-top: 22px; }
      .player { border-radius: 8px; }
      .links { column-gap: 24px; margin-top: 12px; }
      footer { margin-top: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="identity">
        <p class="competition">2026 全国大学生机器人与算法大赛</p>
        <p class="team"><span>参赛队伍</span>ROBOT261937J</p>
      </div>
      <h1 id="swan-title">小楚机器人 · 天鹅湖</h1>
    </header>
    <section class="dance" id="swan-lake" aria-labelledby="swan-title">
      <div class="player">
        <video controls playsinline preload="metadata" poster="media/swan-lake-poster.png" aria-label="小楚机器人天鹅湖舞蹈，含配乐，无对白">
          <source src="media/swan-lake.mp4?v=ae98d1d3" type="video/mp4">
          当前浏览器不支持播放，请<a href="media/swan-lake.mp4?v=ae98d1d3">下载 MP4 视频</a>。
        </video>
      </div>
      <nav class="links" aria-label="视频与资料">
        <a href="media/swan-lake.mp4?v=ae98d1d3" download>下载视频</a>
        <a href="https://github.com/gcwhust/JC04_dancing#readme">源码与复现</a>
        <a href="media/design.pdf">设计说明</a>
        <a href="media/workflow.png">流程图</a>
      </nav>
    </section>
    <footer><a href="https://github.com/gcwhust/JC04_dancing/blob/main/docs/audio-provenance.md">配乐来源</a></footer>
  </main>
</body>
</html>
