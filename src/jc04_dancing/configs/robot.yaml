model:
  resource: assets/robot/robot.xml
  initial_keyframe: standing
  root_joint: root
  support_equality: base_support
  # qpos0 already uses rest_deg; hinge refs preserve original URDF angles.
  # Swan Lake stays within the original source joint limits.
  joint_range_overrides: {}
joint_order:
  - right_shoulder_pitch
  - right_shoulder_roll
  - right_elbow_pitch
  - left_shoulder_pitch
  - left_shoulder_roll
  - left_elbow_pitch
  - right_hip_pitch
  - right_knee_pitch
  - left_hip_pitch
  - left_knee_pitch
rest_deg:
  right_shoulder_pitch: 0.0
  right_shoulder_roll: 0.0
  right_elbow_pitch: 0.0
  left_shoulder_pitch: 0.0
  left_shoulder_roll: 0.0
  left_elbow_pitch: 0.0
  right_hip_pitch: 40.0
  right_knee_pitch: 100.7787
  left_hip_pitch: 40.0
  left_knee_pitch: 100.7787
wheels:
  # Swan Lake supplies both wheel velocity targets in its full-body score.
  mode: driven
  joints: [right_wheel_joint, left_wheel_joint]
  lock_equalities: [right_wheel_lock, left_wheel_lock]
  velocity_gain: 4.0
  max_torque: 4.0
  max_speed_rad_s: 2.0
  assist_damping: 0.001
  # Effective barrel-roller resistance, not a measured tire coefficient.
  # Passive main axles provide longitudinal rolling; low lateral drag permits yaw.
  assist_friction: [0.03, 0.0001, 0.0001]
# Initial simulator gains only; tune and validate with physical integration.
actuators:
  right_shoulder_pitch: {kp: 40.0, kd: 2.0, max_torque: 30.0}
  right_shoulder_roll: {kp: 40.0, kd: 2.0, max_torque: 30.0}
  right_elbow_pitch: {kp: 40.0, kd: 2.0, max_torque: 30.0}
  left_shoulder_pitch: {kp: 40.0, kd: 2.0, max_torque: 30.0}
  left_shoulder_roll: {kp: 40.0, kd: 2.0, max_torque: 30.0}
  left_elbow_pitch: {kp: 40.0, kd: 2.0, max_torque: 30.0}
  right_hip_pitch: {kp: 320.0, kd: 12.0, max_torque: 80.0}
  right_knee_pitch: {kp: 320.0, kd: 12.0, max_torque: 80.0}
  left_hip_pitch: {kp: 320.0, kd: 12.0, max_torque: 80.0}
  left_knee_pitch: {kp: 320.0, kd: 12.0, max_torque: 80.0}
scene:
  # External velocity feedback must resolve the low-inertia arm dynamics.
  timestep: 0.0005
  gravity: [0.0, 0.0, -9.81]
  friction: [1.0, 0.005, 0.0001]
  # Finite display size of the infinite collision plane; expose physical motion.
  floor_half_size: 50.0
camera:
  name: overview
  follow_base_xy: true
  distance: 2.2
  azimuth: 135.0
  elevation: -15.0
  lookat: [0.0, 0.0, 0.5]
