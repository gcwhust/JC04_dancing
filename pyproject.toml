[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "jc04-dancing"
version = "0.1.0"
description = "Independent JC04 MuJoCo dance competition project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mujoco==3.3.7", "numpy==2.2.6", "scipy==1.15.3", "PyYAML==6.0.3",
  "imageio-ffmpeg==0.6.0", "Pillow==12.0.0", "matplotlib==3.10.7", "reportlab==4.4.4",
]

[project.optional-dependencies]
dev = ["pytest==9.0.0", "trimesh==4.9.0", "pypdf==6.2.0", "PyMuPDF==1.26.6", "build==1.3.0"]

[project.scripts]
jc04-dancing = "jc04_dancing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jc04_dancing = ["assets/**/*", "configs/*.yaml", "configs/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["render: requires a working MuJoCo offscreen backend (set MUJOCO_GL before Python starts)"]
